apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellystat
  annotations:
spec:
  project: default
  source:
    repoURL: https://anthonymag.github.io/helm-charts/
    targetRevision: 0.0.1
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: jellystat.image.tag
          value: 1.1.12
    chart: jellystat
  destination:
    server: https://kubernetes.default.svc
    namespace: jellystat
