apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lubelogger-public
  annotations:
    argocd-image-updater.argoproj.io/image-list: ghcr.io/hargata/lubelogger:~v1.5
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-repository: https://github.com/anthonymag/argocd-apps.git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: ""
  sources:
    - chart: lubelogger
      repoURL: https://anza-labs.github.io/charts
      targetRevision: 1.3.0
      helm:
        releaseName: lubelogger-public
        valueFiles:
          - $values/lubelogger-values/values.yaml
    - ref: values
      repoURL: https://anthonymag.github.io/helm-charts.git
      targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: lubelogger-public
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true

