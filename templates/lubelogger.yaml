apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lubelogger
  annotations:
    argocd-image-updater.argoproj.io/image-list: lubelogger=ghcr.io/hargata/lubelogger:~v1.5
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-repository: https://github.com/anthonymag/argocd-apps.git
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/lubelogger.update-strategy: semver
    argocd-image-updater.argoproj.io/lubelogger.helm.image-name: lubelogger.image.repository
    argocd-image-updater.argoproj.io/lubelogger.helm.image-tag: lubelogger.image.tag
spec:
  project: default
  source:
    repoURL: https://anthonymag.github.io/helm-charts/
    targetRevision: 2.1.3
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: lubelogger.image.tag
          value: v1.6.8
    chart: lubelogger
  destination:
    server: https://kubernetes.default.svc
    namespace: lubelogger
  ignoreDifferences:
    - group: apps # https://argo-cd.readthedocs.io/en/stable/user-guide/diffing/#application-level-configuration
      kind: StatefulSet
      name: lubelogger
      jsonPointers: 
        - /spec/updateStrategy/rollingUpdate/maxUnavailable
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

