apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planka 
spec:
  project: default
  source:
    repoURL: https://anthonymag.github.io/helm-charts/
    targetRevision: 1.3.0
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: planka.image.tag
          value: 2.2.1
    chart: planka
  destination:
    server: https://kubernetes.default.svc
    namespace: planka
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  
